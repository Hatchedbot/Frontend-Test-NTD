<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tareas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="pagina">
    <header class="cabecera">
      <h1>Tareas</h1>
      <p class="resumen" id="resumen">0 de 0 completadas</p>
    </header>

    <div class="tablero">
      <section class="columna" data-estado="pendiente">
        <header class="columna-cabecera">
          <span class="columna-punto"></span>
          <h2>Pendiente</h2>
          <span class="columna-contador" id="contador-pendiente">0</span>
        </header>
        <ul class="tarjetas" id="lista-pendiente" aria-label="Tareas pendientes"></ul>
        <button type="button" class="btn-agregar" data-estado="pendiente">+ Agregar tarea</button>
      </section>

      <section class="columna" data-estado="en_progreso">
        <header class="columna-cabecera">
          <span class="columna-punto"></span>
          <h2>En progreso</h2>
          <span class="columna-contador" id="contador-en_progreso">0</span>
        </header>
        <ul class="tarjetas" id="lista-en_progreso" aria-label="Tareas en progreso"></ul>
        <button type="button" class="btn-agregar" data-estado="en_progreso">+ Agregar tarea</button>
      </section>

      <section class="columna" data-estado="completada">
        <header class="columna-cabecera">
          <span class="columna-punto"></span>
          <h2>Completada</h2>
          <span class="columna-contador" id="contador-completada">0</span>
        </header>
        <ul class="tarjetas" id="lista-completada" aria-label="Tareas completadas"></ul>
        <button type="button" class="btn-agregar" data-estado="completada">+ Agregar tarea</button>
      </section>
    </div>

    <p id="mensaje" class="mensaje oculto" role="status"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
